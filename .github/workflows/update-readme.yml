name: Auto Update README with Latest Projects

on:
  schedule:
    # 每天北京时间 03:00 (UTC 19:00 前一天) 自动更新，保证星星数等数据及时刷新
    - cron: '0 19 * * *'
  workflow_dispatch:         # 手动触发
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"          # 避免 bot 修改 README 再次触发死循环
  watch:
    types: [started]         # 当本 profile 仓库自身被 star 时立即触发
  fork:                      # 当有人 fork 时触发

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyGithub
        run: pip install PyGithub

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🪄 auto: update project list in README" || echo "No changes."
          git push
