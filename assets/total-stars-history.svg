<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Star History</title>
  <desc id="desc">所有公开仓库的总星数趋势占位图，工作流运行后会刷新为真实历史曲线。</desc>
  <rect width="960" height="620" fill="#ffffff" />
  <style>
    .sketch {
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hand {
      font-family: Segoe Print, Comic Sans MS, Microsoft YaHei, sans-serif;
    }
  </style>
  <circle cx="376" cy="44" r="14" fill="#ffd7d7" />
  <circle cx="376" cy="40" r="8" fill="#f97316" opacity="0.85" />
  <text x="480" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#111111" class="hand">Star History</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#666666" class="hand">当前展示的是占位效果，GitHub Actions 运行后会替换成所有项目累计星数的真实曲线</text>
